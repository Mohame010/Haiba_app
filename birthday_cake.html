<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تورتة عيد ميلاد مروة 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top: #2b1b3d;
    --bg-bottom: #56294f;
    --gold: #f0cf7a;
    --pink: #f6a6c1;
    --pink-deep: #e881a8;
    --lav: #c9a7e0;
    --mint: #a8e6cf;
    --cream: #fff7ef;
    --choc: #6b3f2a;
    --plate: #fdf6e9;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    font-family:'Cairo', sans-serif;
    background: radial-gradient(circle at 50% 0%, #4a2a55, var(--bg-top) 45%, var(--bg-bottom) 100%);
    color: var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    position:relative;
  }

  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .stars span{
    position:absolute;
    width:3px; height:3px;
    background: var(--gold);
    border-radius:50%;
    opacity:0.7;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.2; }
    50%{ opacity:0.9; }
  }

  header{
    text-align:center;
    padding: 56px 20px 10px;
    position:relative; z-index:1;
  }

  .eyebrow{
    font-size:14px;
    letter-spacing:1px;
    color: var(--gold);
    background: rgba(0,0,0,0.25);
    display:inline-block;
    padding:6px 18px;
    border-radius:30px;
    border:1px solid rgba(240,207,122,0.35);
    margin-bottom:18px;
  }

  h1{
    font-family:'Lalezar', cursive;
    font-size: clamp(36px, 7vw, 64px);
    color: var(--gold);
    text-shadow: 0 3px 0 rgba(0,0,0,0.3);
  }

  h1 span{ color: var(--pink); }

  .subtitle{
    margin-top:12px;
    font-size: clamp(15px,2vw,19px);
    opacity:0.85;
    max-width:520px;
    margin-inline:auto;
    line-height:1.9;
  }

  /* ===== المسرح ===== */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 460px;
    padding: 50px 20px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .cake{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* الشموع واللهب فوق أعلى دور */
  .candles{
    display:flex;
    gap:26px;
    margin-bottom:-6px;
    z-index:5;
  }
  .candle{
    width:8px;
    height:34px;
    border-radius:3px;
    position:relative;
    box-shadow: inset -2px 0 0 rgba(0,0,0,0.15);
  }
  .candle:nth-child(1){ background: linear-gradient(180deg, var(--pink-deep), var(--pink)); }
  .candle:nth-child(2){ background: linear-gradient(180deg, var(--lav), #e6d3f5); height:42px;}
  .candle:nth-child(3){ background: linear-gradient(180deg, var(--mint), #d4f5e6); }
  .candle:nth-child(4){ background: linear-gradient(180deg, var(--gold), #fbe6a0); height:42px;}
  .candle:nth-child(5){ background: linear-gradient(180deg, var(--pink), var(--pink-deep)); }

  .flame{
    position:absolute;
    top:-16px; left:50%;
    transform: translateX(-50%);
    width:10px; height:16px;
    background: radial-gradient(circle at 50% 30%, #fff6c8, #ffcc4d 55%, #ff8a3d 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 1s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 6px rgba(255,180,60,0.8));
  }
  @keyframes flicker{
    0%{ transform: translateX(-50%) scale(1) rotate(-3deg); }
    100%{ transform: translateX(-50%) scale(1.12) rotate(3deg); }
  }

  /* أدوار التورتة */
  .tier{
    position:relative;
    border-radius: 14px 14px 10px 10px;
    box-shadow:
      inset 0 -10px 14px rgba(0,0,0,0.12),
      inset 0 6px 10px rgba(255,255,255,0.35),
      0 10px 18px rgba(0,0,0,0.28);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow:visible;
  }

  /* كريمة مموجة أعلى كل دور */
  .tier::before{
    content:"";
    position:absolute;
    top:-9px; left:0; right:0;
    height:20px;
    background-image: radial-gradient(circle, var(--tier-icing) 55%, transparent 58%);
    background-size: 22px 22px;
    background-position: 0 0;
    background-repeat: repeat-x;
  }

  .tier .band{
    position:absolute;
    bottom:10px; left:0; right:0;
    height:10px;
    background: repeating-linear-gradient(
      90deg,
      var(--tier-band) 0 14px,
      transparent 14px 28px
    );
    opacity:0.55;
  }

  .tier .dots{
    position:absolute;
    top:6px; left:0; right:0;
    display:flex;
    justify-content:space-evenly;
  }
  .tier .dots span{
    width:9px; height:9px;
    border-radius:50%;
    background: var(--dot-color);
    box-shadow: 0 2px 3px rgba(0,0,0,0.2);
  }

  .tier1{ width:130px; height:58px; background: linear-gradient(180deg, #fbeef2, var(--pink)); --tier-icing: var(--cream); --tier-band: #ffffff; --dot-color: var(--gold); }
  .tier2{ width:190px; height:66px; background: linear-gradient(180deg, #f3e9fb, var(--lav)); --tier-icing: var(--cream); --tier-band: #ffffff; --dot-color: var(--pink-deep); }
  .tier3{ width:250px; height:72px; background: linear-gradient(180deg, #e9fbf3, var(--mint)); --tier-icing: var(--cream); --tier-band: #ffffff; --dot-color: var(--lav); }
  .tier4{ width:310px; height:78px; background: linear-gradient(180deg, #fff4dc, var(--gold)); --tier-icing: var(--cream); --tier-band: #ffffff; --dot-color: var(--pink); }
  .tier5{ width:370px; height:86px; background: linear-gradient(180deg, #ffe3ec, var(--pink-deep)); --tier-icing: var(--cream); --tier-band: #ffffff; --dot-color: var(--mint); }

  .tier{ margin-top:-10px; }

  /* الطبق */
  .plate{
    width:400px;
    max-width:90vw;
    height:22px;
    background: linear-gradient(180deg, var(--plate), #f0dfc0);
    border-radius: 50%;
    box-shadow: 0 12px 18px rgba(0,0,0,0.35), inset 0 -4px 6px rgba(0,0,0,0.15);
    margin-top:-6px;
    z-index:2;
  }

  .cake-caption{
    margin-top: 26px;
    text-align:center;
    font-family:'Lalezar', cursive;
    font-size: clamp(22px, 4vw, 30px);
    color: var(--gold);
  }

  .note{
    margin-top:10px;
    text-align:center;
    font-size:16px;
    opacity:0.85;
    max-width:420px;
    line-height:1.9;
  }

  .cta{
    margin: 30px 0 70px;
    background: linear-gradient(135deg, var(--pink-deep), var(--lav));
    color: #2b1b3d;
    font-weight:800;
    font-size:17px;
    padding: 14px 34px;
    border-radius: 40px;
    border:none;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    transition: transform 0.2s ease;
  }
  .cta:hover{ transform: translateY(-3px) scale(1.03); }

  footer{
    text-align:center;
    padding: 18px;
    font-size:13px;
    opacity:0.5;
    position:relative; z-index:1;
  }

  @media (max-width:420px){
    .tier1{width:100px;} .tier2{width:150px;} .tier3{width:200px;} .tier4{width:250px;} .tier5{width:300px;}
    .plate{width:320px;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<header>
  <div class="eyebrow">🎂 5 أدوار.. عشان مروة تستاهل كل ده 🎂</div>
  <h1>تورتة يوم <span>ميلادك</span></h1>
  <p class="subtitle">دور بحلاوة الحلوة، ودور بلون فرحتك.. طفّي الشموع واتمني اللي في بالك يا مروة 🌟</p>
</header>

<div class="stage">
  <div class="cake" id="cake">
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <div class="tier tier1"><div class="dots"><span></span><span></span><span></span></div><div class="band"></div></div>
    <div class="tier tier2"><div class="dots"><span></span><span></span><span></span><span></span></div><div class="band"></div></div>
    <div class="tier tier3"><div class="dots"><span></span><span></span><span></span><span></span><span></span></div><div class="band"></div></div>
    <div class="tier tier4"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="band"></div></div>
    <div class="tier tier5"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="band"></div></div>
    <div class="plate"></div>
  </div>

  <div class="cake-caption">كل سنة وانتي طيبة يا مروة 🎉</div>
  <p class="note">دوس على الزرار وطفّي الشموع، بس متنسيش تتمني إن كل الحلاوة اللي في الدنيا تكون نصيبك 🍰</p>
  <button class="cta" id="blowBtn">🕯️ طفّي الشموع</button>
</div>

<footer>صُنعت بحب لمروة 💛</footer>

<script>
  // نجوم الخلفية
  const starsContainer = document.getElementById('stars');
  for(let i=0;i<50;i++){
    const s = document.createElement('span');
    s.style.top = Math.random()*100 + 'vh';
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDelay = (Math.random()*2.4) + 's';
    starsContainer.appendChild(s);
  }

  // إطفاء الشموع
  const btn = document.getElementById('blowBtn');
  const flames = document.querySelectorAll('.flame');
  btn.addEventListener('click', () => {
    const alreadyOff = btn.dataset.off === "1";
    flames.forEach(f => { f.style.display = alreadyOff ? 'block' : 'none'; });
    btn.textContent = alreadyOff ? '🕯️ طفّي الشموع' : '✨ يلا هاتي التمنية!';
    btn.dataset.off = alreadyOff ? "0" : "1";
  });
</script>

</body>
</html>
