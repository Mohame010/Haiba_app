name: q360education
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  go_router: ^16.2.1

  flutter_screenutil: ^5.9.3

  get_it: ^8.2.0

  google_fonts: ^6.3.1

  smooth_page_indicator: ^1.2.1

  flutter_svg: ^2.2.0
  supabase_flutter: ^2.17.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  video_player: ^2.9.2
  audioplayers: ^6.1.1
  just_audio: ^0.10.6
  # Page-native overlays keep annotations locked to PDF coordinates at any zoom.
  pdfrx: ^3.1.0
  path_provider: ^2.1.5
  webview_flutter: ^4.10.0
  awesome_notifications: ^0.12.1
  firebase_messaging: ^16.5.0
  firebase_core: ^4.13.0
  rename: ^3.1.0
  device_info_plus: ^12.4.0
  package_info_plus: ^8.3.1
  http: ^1.6.0
  crypto: ^3.0.7
  file_picker: 10.3.10
  # flutter_native_splash 2.4.7 declares an Android plugin. Keep it as a
  # runtime dependency so release builds include the native class referenced
  # by GeneratedPluginRegistrant.
  flutter_native_splash: ^2.4.7
  material_ui: any
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/image/
    - assets/svgs/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: IBM
      fonts:
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBM/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBM/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
